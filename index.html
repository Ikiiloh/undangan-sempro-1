<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="public/logo.png" />
  <title>Undangan Sempro - Aulia Salsa</title>

  <meta property="og:title" content="Undangan Seminar Proposal" />

  <meta property="og:description" content="Oleh: Aulia Salsa. Klik untuk melihat detail acara." />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="" />

  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- 1. Impor Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 2. Impor Font dari Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet" />

  <!-- 3. Konfigurasi Kustom Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Poppins", "sans-serif"],
            title: ["Dancing Script", "cursive"],
            name: ["Playfair Display", "serif"],
          },
          colors: {
            brand: {
              bg: "#F0E8F0",
              grid: "#D4B5D8",
              accent: "#E8A4C9",
              "accent-dark": "#D48AB0",
              dark: "#4A3347",
              light: "#7B6B8D",
              pink: "#F0A6CA",
              purple: "#B8A9C9",
              lavender: "#C9B8DC",
              white: "#FFFBFE"
            },
          },
          // Animasi untuk doodle
          keyframes: {
            float: {
              "0%, 100%": { transform: "translateY(0)" },
              "50%": { transform: "translateY(-10px)" },
            },
            spinSlow: {
              "0%": { transform: "rotate(0deg)" },
              "100%": { transform: "rotate(360deg)" },
            },
          },
          animation: {
            float: "float 4s ease-in-out infinite",
            spinSlow: "spinSlow 20s linear infinite",
          },
        },
      },
    };
  </script>
  <style>
    /* Pengaturan dasar untuk halaman */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body.loading {
      overflow: hidden;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #FFD1DC 0%, #E8A4C9 30%, #C9B8DC 60%, #D4B5D8 100%);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
    }

    /* Flower Loader */
    .loader {
      position: relative;
      width: 100px;
      height: 100px;
      animation: bloom 2s ease-in-out infinite;
    }

    /* Flower Petals */
    .petal {
      position: absolute;
      width: 30px;
      height: 50px;
      background: linear-gradient(to bottom, #FFB6C1, #FF69B4);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      left: 50%;
      top: 50%;
      transform-origin: center bottom;
      box-shadow: 0 4px 10px rgba(255, 105, 180, 0.3);
      animation: petalPulse 1.5s ease-in-out infinite;
    }

    .petal-1 {
      transform: translateX(-50%) translateY(-100%) rotate(0deg);
      animation-delay: 0s;
    }

    .petal-2 {
      transform: translateX(-50%) translateY(-100%) rotate(45deg);
      animation-delay: 0.1s;
    }

    .petal-3 {
      transform: translateX(-50%) translateY(-100%) rotate(90deg);
      animation-delay: 0.2s;
    }

    .petal-4 {
      transform: translateX(-50%) translateY(-100%) rotate(135deg);
      animation-delay: 0.3s;
    }

    .petal-5 {
      transform: translateX(-50%) translateY(-100%) rotate(180deg);
      animation-delay: 0.4s;
    }

    .petal-6 {
      transform: translateX(-50%) translateY(-100%) rotate(225deg);
      animation-delay: 0.5s;
    }

    .petal-7 {
      transform: translateX(-50%) translateY(-100%) rotate(270deg);
      animation-delay: 0.6s;
    }

    .petal-8 {
      transform: translateX(-50%) translateY(-100%) rotate(315deg);
      animation-delay: 0.7s;
    }

    /* Alternate petal colors */
    .petal-1,
    .petal-3,
    .petal-5,
    .petal-7 {
      background: linear-gradient(to bottom, #FFF0F5, #FFB6C1);
    }

    .petal-2,
    .petal-4,
    .petal-6,
    .petal-8 {
      background: linear-gradient(to bottom, #FFB6C1, #FF69B4);
    }

    /* Flower Center */
    .flower-center {
      position: absolute;
      width: 30px;
      height: 30px;
      background: radial-gradient(circle, #FFD700 30%, #FFA500 100%);
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
      animation: centerPulse 1s ease-in-out infinite;
    }

    /* Animations */
    @keyframes bloom {

      0%,
      100% {
        transform: scale(0.9) rotate(0deg);
      }

      50% {
        transform: scale(1.05) rotate(10deg);
      }
    }

    @keyframes petalPulse {

      0%,
      100% {
        opacity: 0.7;
      }

      50% {
        opacity: 1;
      }
    }

    @keyframes centerPulse {

      0%,
      100% {
        transform: translate(-50%, -50%) scale(0.9);
      }

      50% {
        transform: translate(-50%, -50%) scale(1.1);
      }
    }

    /* Loading text */
    .loading-text {
      margin-top: 30px;
      font-family: 'Dancing Script', cursive;
      font-size: 1.8rem;
      color: white;
      text-shadow: 2px 2px 4px rgba(232, 164, 201, 0.5);
      animation: fadeInOut 1.5s ease-in-out infinite;
    }

    @keyframes fadeInOut {

      0%,
      100% {
        opacity: 0.5;
      }

      50% {
        opacity: 1;
      }
    }
  </style>
</head>

<body class="bg-brand-bg font-sans loading">
  <!-- Ini adalah elemen untuk loading screen -->
  <div id="loading-screen" class="loader-container">
    <div class="loader">
      <!-- 8 kelopak bunga -->
      <div class="petal petal-1"></div>
      <div class="petal petal-2"></div>
      <div class="petal petal-3"></div>
      <div class="petal petal-4"></div>
      <div class="petal petal-5"></div>
      <div class="petal petal-6"></div>
      <div class="petal petal-7"></div>
      <div class="petal petal-8"></div>
      <!-- Tengah bunga -->
      <div class="flower-center"></div>
    </div>
    <p class="loading-text">Loading...</p>
  </div>
  <!-- 4. Target Root untuk React -->
  <div id="root"></div>

  <!-- 5. Titik Masuk (Entry Point) Aplikasi Vite -->
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
